<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    
    <style>
        body {
            background-image: url('https://static.wikia.nocookie.net/yandere-simulator-fanon/images/0/0a/CookingClub2GhoulGirls90.png/revision/latest?cb=20210320090942');
            background-size: cover;    
            
        }

        .main-container {
            max-width: 900px;
            margin: auto;
            margin-right: auto;
        }

        .header {
            background: linear-gradient(#ff8fab, #ff8fab);
            color: white;
            border-radius: 20px;
            padding: 35px;
        }


        .section-title {
            color: #ff8fab;
            font-weight: bold;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #ffb3c6;
        }

        .form-control:focus {
            border-color: #ff8fab;
        }

        .btn {
            background-color: #ff8fab;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            color: white;
        }

        .btn:hover {
            background-color: #ffe5ec;
        }

        .footer {
            color: white
        }

        #output {
            background-color: #ffe5ec;
            border: 2px solid #ffb3c6;
            border-radius: 15px;
            padding: 20px; 
        }
    
    </style>
</head>
<body>

    <div class="container py-5 main-container">

        <div class="header text-start mb-4">
          <h1 class="display-5 fw-bold"> Rainbow Catering Club </h1>
          <p class="lead mb-0">Add New Member!</p>
          </div>

        <div class="card section-card">
            <div class="card-body p-4">
            <h2 class="section-title">
                Input Name:
            </h2>

        <form>

        <div class="mb-3">
            <label for="fname" class="form-label fw-bold">
                First Name
            </label>

            <input
             type="text"
             id="fname"
             class="form-control"
             placeholder="ex.Ayano">

        </div>

        <div class="mb-3">
            <label for="lname" class="form-label fw-bold">
                Last Name
            </label>

            <input
            type="text"
            id="lname"
            class="form-control"
            placeholder="ex.Aishi">

        </div>

          <br>
        <div class="row">
          <div class="col">
              <button class="btn w-100" type="button" py-click="addmember">Add member</button>
            </div>
        </div>
        <br>
        <div class="row">
            <div id="output">
                <div id="div1"></div>
                <div id ="div2"></div>
            </div>
        </div>
    </form>
    <br>
</div>
<br><br>
    
        <div class="text-center mt-4 text-muted">
            <small>
                Q2 Drill 2 • Made with HTML, Bootstrap & PyScript • Jilliane Tech
            </small>

        </div>

    </div>


    <script type="py" src="main.py"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    </script>

</body>
</html>
